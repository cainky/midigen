[project]
name = "midigen-lib"
version = "1.1.1"
description = "High-level, theory-powered MIDI generation library"
authors = [{ name = "cainky", email = "kylecain.me@gmail.com" }]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
keywords = ["midi", "music-generation", "mido", "music-theory"]
dependencies = ["mido>=1.3.2,<2"]

[project.urls]
Repository = "https://github.com/cainky/midigen"

[dependency-groups]
# pre-commit pulls filelock via virtualenv; the patched filelock (>=4.2.1) needs 3.11+
dev = ["pre-commit>=3.6,<5.0; python_version >= '3.11'", "flake8>=6.1,<8.0", "pytest>=9.0.1,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midigen"]

[tool.uv]
# GHSA advisories for filelock ReadWriteLock/SoftFileLock, fixed in 4.2.1
constraint-dependencies = ["filelock>=4.2.1"]
