[project]
name = "midigen-lib"
version = "1.1.0"
description = "High-level, theory-powered MIDI generation library"
authors = [{ name = "cainky", email = "kylecain.me@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
keywords = ["midi", "music-generation", "mido", "music-theory"]
dependencies = ["mido>=1.3.2,<2"]

[project.urls]
Repository = "https://github.com/cainky/midigen"

[dependency-groups]
dev = ["pre-commit>=3.6,<5.0", "flake8>=6.1,<8.0", "pytest>=9.0.1,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midigen"]
